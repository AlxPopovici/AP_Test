version: 2

models:
  - name: stg_player_reg_attribution
    description: Player-level attribution with timezone-corrected REG and FTD dates (INITIAL_BASE in the V2 SQL).
    columns:
      - name: player_id
        tests: [not_null]
      - name: business_domain_id
        tests: [not_null]

  - name: stg_ltv
    description: Latest LTV prediction per player (LTV_ACQUISITION for non-PL, manual source for PL).
    columns:
      - name: player_id
        tests:
          - not_null
          - unique

  - name: int_player_performance
    description: NGP/NGR in EUR per player, 30-day and Y1 windows after FTD.
    columns:
      - name: player_id
        tests:
          - not_null
          - unique

  - name: int_player_attribution_base
    description: Player-level grain with performance, LTV, LTV actualized and conversion window flags.
    columns:
      - name: player_id
        tests:
          - not_null
          - unique

  - name: dbt_asdk_agg_attribution_data_v2
    description: >
      dbt port of PROD.SBX_BI.TMP_VW_ASDK_AGG_ATTRIBUTION_DATA_V2. One row per business domain,
      event date and attribution dimensions. REGS / FTD_Dx are on the registration date axis,
      FTDS / NGR / NGP / LTV on the FTD date axis. All monetary values in EUR.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - business_domain_id
              - event_date
              - final_acquisition_source_group
              - final_acquisition_channel
              - final_acquisition_subchannel
              - final_platform_type
              - final_ad_platform
              - final_attribution_source
              - final_mapping_used
    columns:
      - name: business_domain_id
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [-1, 1, 2, 3, 8, 10, 14, 15, 16]
      - name: event_date
        tests: [not_null]
      - name: regs
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: ftds
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
